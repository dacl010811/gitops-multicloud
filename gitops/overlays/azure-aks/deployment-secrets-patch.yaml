apiVersion: apps/v1
kind: Deployment
metadata:
  name: sri-facturacion-service
spec:
  template:
    spec:
      containers:
        - name: sri-facturacion-service
          # envFrom se reemplaza por completo: incluye ConfigMap base + Secret sincronizado
          envFrom:
            - configMapRef:
                name: sri-facturacion-config
            - secretRef:
                name: sri-facturacion-db
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            # Nombre REAL del driver CSI registrado (root cause incidente #4:
            # es secrets-store.csi.k8s.io SIN "x-"; el x-k8s.io es el grupo
            # API del CRD SPC, no el nombre del driver). Fix preventivo AZURE.
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sri-facturacion-azure-secrets

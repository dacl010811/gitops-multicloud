# UMBRAL DIDACTICO (FASE 7, demo HPA 2026-10-08): baja el target de CPU del
# HPA de 70% a 5% para que la demo de carga escale con endpoints baratos
# (/health es async y no quema CPU suficiente para acercarse al 70% de 250m).
# JSON6902: /spec/metrics/0 = CPU (primer elemento de hpa.yml base).
# metrics-server YA viene con AKS (asimetria a favor vs EKS: no se instala).
# REVERTIR al cerrar la demo (comentar la entrada en kustomization + push)
# — el umbral real (70%) vive en bases/hpa.yml. Espejo del demo AWS.
- op: replace
  path: /spec/metrics/0/resource/target/averageUtilization
  value: 5

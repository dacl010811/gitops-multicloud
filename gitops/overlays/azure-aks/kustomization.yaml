apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sri-facturacion-azure-aks

namespace: sri-facturacion

resources:
  - ../../bases
  #- ingress.yaml
  # TEMPORAL (sesión flujo GitOps): secrets-store-csi.yaml exige el CSI Driver
  # instalado + Key Vault + Managed Identity reales. Se reactiva en la sesión
  # dedicada a secretos (ver placeholders <ACR_NAME>, <MANAGED_IDENTITY_CLIENT_ID>).

# Sobrescribe el ConfigMap base con los valores específicos de Azure AKS
patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: sri-facturacion-config
  # NOTA (sesión de secretos): restaurar deployment-secrets-patch.yaml junto
  # con secrets-store-csi.yaml. OJO: ese parche declara metadata.name
  # 'sri-facturacion-service', pero el Deployment base se llama
  # 'sri-facturacion-service-deployment' — corregir el name antes de activarlo.

# Imagen real del microservicio en ACR (az acr build / pipeline CI).
# El pull de los nodos usa la kubelet identity (AcrPull via bootstrap-acr-rbac-azure.sh).
images:
  - name: sri-facturacion-service
    newName: sriacrtfm23c5.azurecr.io/sri-facturacion-service
    newTag: "v1"

commonLabels:
  cloud: azure-aks

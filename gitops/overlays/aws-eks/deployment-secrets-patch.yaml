apiVersion: apps/v1
kind: Deployment
metadata:
  name: sri-facturacion-service-deployment
spec:
  template:
    spec:
      # CIERRE #4-ter: el pod monta con el SA anotado con el rol — el
      # provider AWS resuelve la identidad desde la anotacion de ESTE SA
      # (serviceaccount.yaml), no desde el SA del driver.
      serviceAccountName: sri-facturacion-sa
      containers:
        - name: sri-facturacion-service-deployment
          # envFrom se reemplaza por completo: ConfigMap base (redundante con el
          # env por configMapKeyRef del base — env explícito GANA sobre envFrom)
          # + Secret sincronizado por secretObjects (DB_USER/DB_PASSWORD/DB_HOST)
          envFrom:
            - configMapRef:
                name: sri-facturacion-config
            - secretRef:
                name: sri-facturacion-db
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            # Nombre REAL del driver CSI registrado (root cause incidente #4:
            # es secrets-store.csi.k8s.io SIN "x-"; el x-k8s.io es el grupo
            # API del CRD SPC, no el nombre del driver).
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sri-facturacion-aws-secrets

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sri-facturacion-aws-eks

namespace: sri-facturacion

resources:
- ../../bases
  # RESTAURADO (sesion 2026-10-03, Ingress + IRSA): primero se instalo el
  # AWS Load Balancer Controller con identidad IRSA (iac/aws/lb-controller)
  # y recien entonces se habilito aqui. Habilitarlo sin controller dejaba
  # ArgoCD en Progressing eterno (misma leccion que AGIC en Azure).
  # CIERRE (sesion 2026-10-04): vuelve a comentarse — ArgoCD prunea el
  # Ingress y el controller BORRA el ALB. REGLA DE ORO FinOps: el Ingress
  # se borra ANTES que el cluster; si no, el ALB queda huerfano facturando.
  # - ingress.yaml
  # SESION SECRETOS (2026-10-05): ACTIVADO — requiere CSI Driver + provider
  # AWS instalados (scripts/bootstrap-secrets-csi-eks.sh) y parametros SSM
  # /sri-facturacion/* (iac/aws/secrets-csi). CIERRE: se MANTIENE activo —
  # la proxima sesion re-crea el modulo secrets-csi y el driver ANTES de
  # que ArgoCD sincronice; pods en ContainerCreating hasta entonces son
  # esperados (sin Ingress activo no hay ALB que huerfane).
- secrets-store-ssm.yaml

# Sobrescribe el ConfigMap base con los valores especificos de AWS EKS
patches:
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: sri-facturacion-config
  # UMBRAL DIDACTICO (Bloque 3): REVERTIDO en el cierre (2026-10-04) — la
  # demo de carga termino; el umbral real (70%) vive en bases/hpa.yml.
  # - path: hpa-patch.yaml
  #   target:
  #     kind: HorizontalPodAutoscaler
  #     name: sri-facturacion-service-hpa
  # SESION SECRETOS (2026-10-05): ACTIVADO tras fix del bug #7 — metadata.name
  # y container name del patch apuntan a sri-facturacion-service-deployment
  # (el nombre REAL del base; sin el fix del container name, el strategic
  # merge anadiria un segundo container en vez de parchear el existente).
- path: deployment-secrets-patch.yaml
  target:
    kind: Deployment
    name: sri-facturacion-service-deployment

# Imagen REAL en ECR (repo creado por Terraform: iac/aws/registry/, state
# aws/registry.tfstate). El pipeline pinea el tag sha via 'kustomize edit
# set image' en cada build; aqui queda 'latest' como valor inicial.
# El nombre logico 'sri-facturacion-service' matchea la imagen del base
# gracias al transformer images: (misma leccion de Azure).
images:
- name: sri-facturacion-service
  newName: 053044806920.dkr.ecr.us-east-1.amazonaws.com/sri-facturacion-service
  newTag: 69608cbcb6ee4cdab53176e88141cecaad42d2f9

commonLabels:
  cloud: aws-eks

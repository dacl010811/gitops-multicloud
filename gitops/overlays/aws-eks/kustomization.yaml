apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sri-facturacion-aws-eks

namespace: sri-facturacion

resources:
- ../../bases
  # RESTAURADO (sesion 2026-10-03, Ingress + IRSA): primero se instalo el
  # AWS Load Balancer Controller con identidad IRSA (iac/aws/lb-controller)
  # y recien entonces se habilito aqui. Habilitarlo sin controller dejaba
  # ArgoCD en Progressing eterno (misma leccion que AGIC en Azure).
- ingress.yaml
  # TEMPORAL: secrets-store-ssm.yaml requiere Secrets Store CSI Driver +
  # provider AWS (no instalados) y placeholders de SSM. Sesion dedicada a
  # secretos lo restaura junto a deployment-secrets-patch.yaml.
  # - secrets-store-ssm.yaml

# Sobrescribe el ConfigMap base con los valores especificos de AWS EKS
patches:
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: sri-facturacion-config
  # UMBRAL DIDACTICO (Bloque 3, PASO C.1): se activa junto al commit del
  # hpa-patch.yaml para la demo de carga; se revierte en el cierre.
  # - path: hpa-patch.yaml
  #   target:
  #     kind: HorizontalPodAutoscaler
  #     name: sri-facturacion-service-hpa
  # TEMPORAL: el parche de secretos monta parametros de SSM via CSI Driver
  # (no instalado). NOTA-BUG: su target apunta a 'sri-facturacion-service'
  # pero el Deployment real es 'sri-facturacion-service-deployment' -> jamas
  # matchearia. Corregir el name al restaurarlo.
  # - path: deployment-secrets-patch.yaml
  #   target:
  #     kind: Deployment
  #     name: sri-facturacion-service

# Imagen REAL en ECR (repo creado por Terraform: iac/aws/registry/, state
# aws/registry.tfstate). El pipeline pinea el tag sha via 'kustomize edit
# set image' en cada build; aqui queda 'latest' como valor inicial.
# El nombre logico 'sri-facturacion-service' matchea la imagen del base
# gracias al transformer images: (misma leccion de Azure).
images:
- name: sri-facturacion-service
  newName: 053044806920.dkr.ecr.us-east-1.amazonaws.com/sri-facturacion-service
  newTag: e3f0540314184832335324d3844f2dc29d686e67

commonLabels:
  cloud: aws-eks

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sri-facturacion-aws-secrets
  labels:
    app: sri-facturacion-service
spec:
  provider: aws
  parameters:
    # SESION SECRETOS (2026-10-05): reescrita — la version sembrada usaba
    # Secrets Manager (objectType: secretsmanager, $0.40/secreto/mes) con
    # jmesPath. Decision FinOps: SSM Parameter Store STANDARD ($0), un
    # parametro SecureString por credencial (patron SSM idiomatico; jmesPath
    # NO aplica a ssmparameter — es exclusivo de Secrets Manager JSON).
    # Parametros creados por iac/aws/secrets-csi (password random en runtime).
    objects: |
      - objectName: "/sri-facturacion/DB_USER"
        objectType: "ssmparameter"
        objectAlias: "DB_USER"
      - objectName: "/sri-facturacion/DB_PASSWORD"
        objectType: "ssmparameter"
        objectAlias: "DB_PASSWORD"
      - objectName: "/sri-facturacion/DB_HOST"
        objectType: "ssmparameter"
        objectAlias: "DB_HOST"
  # Sincroniza los secretos montados a un Secret nativo de Kubernetes
  # (requiere el chart del driver con syncSecret.enabled=true)
  secretObjects:
    - secretName: sri-facturacion-db
      type: Opaque
      data:
        - objectName: DB_USER
          key: DB_USER
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: DB_HOST
          key: DB_HOST

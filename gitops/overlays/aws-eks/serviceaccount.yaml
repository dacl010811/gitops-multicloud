apiVersion: v1
kind: ServiceAccount
metadata:
  name: sri-facturacion-sa
  annotations:
    # IDENTIDAD DEL MONTAJE CSI (cierre #4-ter, 2026-10-05):
    # el provider AWS del Secrets Store CSI NO usa la identidad del driver:
    # al montar lee ESTA anotacion (la del SA del pod que monta el volumen)
    # via API de Kubernetes y asume el rol con el token proyectado del pod
    # (CSIDriver tokenRequests, aud sts.amazonaws.com).
    # El sub debe matchear el trust de iac/aws/secrets-csi/main.tf:
    #   system:serviceaccount:sri-facturacion:sri-facturacion-sa
    # El ARN es un identificador publico de recurso (no es secreto).
    eks.amazonaws.com/role-arn: arn:aws:iam::053044806920:role/sri-eks-cluster-secrets-csi
